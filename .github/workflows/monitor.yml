name: Roblox News Monitor

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run crawler script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        # 直接切進子資料夾執行 Python
        working-directory: ./roblox-news-bot
        run: |
          pip install requests
          python "roblox news monitor.py"

      - name: Commit and push changes if seen_posts.json updated
        working-directory: ./roblox-news-bot
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_posts.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update seen posts [skip ci]" && git push)